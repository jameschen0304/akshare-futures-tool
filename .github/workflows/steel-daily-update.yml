name: Update steel spot snapshot

on:
  schedule:
    # 北京时间工作日 17:05（UTC 09:05，Mon–Fri）
    - cron: "5 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steel-daily-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade pip akshare pandas

      - name: Update all steel varieties to today
        run: |
          python build_steel_spot_daily.py \
            --refresh-rb \
            --lookback-days 120 \
            --rb-ppi-days 90

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steel_spot_daily.json
          if git diff --cached --quiet; then
            echo "No changes to steel_spot_daily.json"
            exit 0
          fi
          git commit -m "chore: auto-update steel snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
